  /* Стиль Дії (дизайн-код Мінцифри): #E7EEF3 / #000 / #FFF / #F2F2F2 / акцент #FFB800,

  :root {

<div class="wrap">
  <header class="top">

</div>

<script>
(function () {
  var MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  var fmt1 = new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var fmtQ = new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 3 });
  function tys(x) { return fmt1.format((x || 0) / 1000); }
  function pct(x, t) { return t ? fmt1.format(x / t * 100) + ' %' : '—'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  // Виклик сервера: у Google Apps Script — google.script.run.api(name, args); у попередньому перегляді — window.PREVIEW_API
  var TOKEN_KEY = 'tribo_token', EMAIL_KEY = 'tribo_email', memToken = '';
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (e) { return memToken; } }
  function setToken(t) { memToken = t || ''; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function errText(e) { return String(e && e.message || e).replace(/^(Exception|Error|Помилка):\s*/i, ''); }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function rpc(name, args) {
    return new Promise(function (res, rej) {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(name, args);
      } else {
        setTimeout(function () { try { res(window.PREVIEW_API[name].apply(null, args)); } catch (e) { rej(e); } }, 60);
      }
    });
  }
  var PRIV = { apiInit: 'init', apiPeriod: 'period', apiClientItems: 'clientItems', apiPlanFact: 'planfact' };
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return rpc(PRIV[fn], [getToken()].concat(args)).catch(function (e) {
      if (String(e && e.message || e).indexOf('AUTH_REQUIRED') >= 0) { setToken(''); showLogin(); return new Promise(function () {}); }
      throw e;
    });
  }

  var S = { tab: lsGet('tribo_tab') || 'sales', init: null, period: null, cache: {}, data: null, otherOpen: false, showAll: false, q: '', open: {}, full: {}, items: {}, charts: [] };
  var app = document.getElementById('app');

  function start() {
    app.innerHTML = '<div class="loading">Завантаження даних…</div>';
    S.cache = {}; S.items = {}; S.open = {}; S.full = {};
    call('apiInit').then(function (init) {
      S.init = init; S.period = init.currentMonth; S.cache[init.currentMonth] = init.period; S.cache[0] = init.yearPeriod; S.data = init.period;
      renderUpdated(); render();
    }).catch(showError);
  }

  // Вхід: пошта + пароль (step 'pw'); запасний шлях — код на пошту (steps 1, 2)
  function showLogin(step, email, msg) {
    step = step || 'pw';
    document.getElementById('upd').innerHTML = ''; document.getElementById('tabs').innerHTML = '';
    email = email || lsGet(EMAIL_KEY);
    var h = '<section class="card login"><h2>Вхід у дашборд</h2>';
    if (step === 'pw') {
      h += '<input class="search" id="lemail" type="email" inputmode="email" autocomplete="username" placeholder="Пошта" value="' + esc(email) + '">' +
        '<input class="search" id="lpass" type="password" autocomplete="current-password" placeholder="Пароль">' +
        '<button class="btn primary full" id="lgo">Увійти</button>' +
        '<button class="lnk" id="lcodeway">Немає пароля? Увійти за кодом із пошти</button>';
    } else if (step === 1) {
      h += '<p class="muted">Введіть свою пошту — надішлемо код входу.</p>' +
        '<input class="search" id="lemail" type="email" inputmode="email" autocomplete="email" placeholder="Пошта" value="' + esc(email) + '">' +
        '<button class="btn primary full" id="lsend">Отримати код</button>' +
        '<button class="lnk" id="lpwway">← Увійти з паролем</button>';
    } else {
      h += '<p class="muted">Код надіслано на <b>' + esc(email) + '</b>, якщо цій адресі дозволено вхід. Перевірте також «Спам».</p>' +
        '<input class="search code" id="lcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 цифр">' +
        '<button class="btn primary full" id="lok">Увійти</button>' +
        '<button class="lnk" id="lback">← Інша пошта або новий код</button>';
    }
    if (msg) h += '<div class="status bad" role="alert"><span aria-hidden="true">⚠</span><div>' + esc(msg) + '</div></div>';
    h += '</section>';
    app.innerHTML = h;
    var $ = function (id) { return document.getElementById(id); };
    if (step === 'pw') {
      var go0 = function () {
        var em = $('lemail').value.trim(), pw = $('lpass').value;
        if (!em || !pw) return;
        $('lgo').disabled = true; $('lgo').textContent = 'Перевіряємо…';
        rpc('login', [em, pw]).then(function (r) { lsSet(EMAIL_KEY, em); setToken(r.token); start(); })
          .catch(function (e) { showLogin('pw', em, errText(e)); });
      };
      $('lgo').onclick = go0;
      $('lpass').onkeydown = $('lemail').onkeydown = function (e) { if (e.key === 'Enter') go0(); };
      $('lcodeway').onclick = function () { showLogin(1, $('lemail').value.trim()); };
      (email ? $('lpass') : $('lemail')).focus();
    } else if (step === 1) {
      var inp = $('lemail'), btn = $('lsend');
      var go = function () {
        var em = inp.value.trim(); if (!em) return;
        btn.disabled = true; btn.textContent = 'Надсилаємо…';
        rpc('requestCode', [em]).then(function () { lsSet(EMAIL_KEY, em); showLogin(2, em); })
          .catch(function (e) { showLogin(1, em, errText(e)); });
      };
      btn.onclick = go; inp.onkeydown = function (e) { if (e.key === 'Enter') go(); }; inp.focus();
      $('lpwway').onclick = function () { showLogin('pw', inp.value.trim()); };
    } else {
      var c = $('lcode'), ok = $('lok');
      var go2 = function () {
        var code = c.value.replace(/\D/g, ''); if (code.length < 6) return;
        ok.disabled = true; ok.textContent = 'Перевіряємо…';
        rpc('verifyCode', [email, code]).then(function (r) { setToken(r.token); start(); })
          .catch(function (e) { showLogin(2, email, errText(e)); });
      };
      ok.onclick = go2; c.oninput = function () { if (c.value.replace(/\D/g, '').length === 6) go2(); };
      c.onkeydown = function (e) { if (e.key === 'Enter') go2(); }; c.focus();
      $('lback').onclick = function () { showLogin(1, email); };
    }
  }

  function logout() { var t = getToken(); setToken(''); rpc('logout', [t]).catch(function () {}); showLogin('pw'); }

  if (getToken()) start(); else showLogin('pw');

  function showError(e) {
    app.innerHTML = '<div class="card status bad err"><span aria-hidden="true">⚠</span><div><b>Помилка.</b> ' + esc(e && e.message || e) + '</div></div>';
  }

  function renderUpdated() {
    var el = document.getElementById('upd'), u = S.tab === 'pf' ? (S.init.updatedPF || S.init.updated) : S.init.updated;
    if (!el) return;
    if (!u) { el.innerHTML = '<span class="muted">Даних ще немає</span> · <button class="lnk" id="logout">Вийти</button>'; document.getElementById('logout').onclick = logout; return; }
    var d = new Date(u);
    var txt = 'Оновлено ' + ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' +
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var hours = (Date.now() - d.getTime()) / 36e5;
    el.innerHTML = esc(txt) + ' · <button class="lnk" id="logout">Вийти</button>' +
      (hours > S.init.staleHours ? '<br><span style="color:var(--warn)">⚠ дані старші за ' + S.init.staleHours + ' год</span>' : '');
    document.getElementById('logout').onclick = logout;
  }

  function selectPeriod(p) {
    S.period = p; S.otherOpen = false; S.showAll = false; S.open = {}; S.full = {};
    if (S.cache[p]) { S.data = S.cache[p]; render(); return; }
    S.data = null; render();
    call('apiPeriod', S.init.year, p).then(function (d) { S.cache[p] = d; if (S.period === p) { S.data = d; render(); } }).catch(showError);
  }

  function periodName(p) { return p ? MONTHS[p - 1] : 'Весь рік'; }

  function render() {
    renderTabs();
    if (S.tab === 'pf' && S.init.planfactMonths && S.init.planfactMonths.length) return renderPF();
    var I = S.init, d = S.data;
    var h = '';
    // 9.1 Верх
    h += '<section class="card hero">';
    h += '<div class="label">Продажі всього, з 01.01.' + I.year + '</div>';
    h += '<div class="big num">' + tys(I.ytd) + '</div><div class="unit">тис. грн без ПДВ</div>';
    h += '<div class="chips" id="chips" role="group" aria-label="Період">';
    for (var m = 1; m <= I.currentMonth; m++) h += '<button class="chip" data-p="' + m + '" aria-pressed="' + (S.period === m) + '">' + MONTHS[m - 1] + '</button>';
    h += '<button class="chip" data-p="0" aria-pressed="' + (S.period === 0) + '">Весь рік</button></div>';
    h += '<div class="sel"><div class="muted">' + (S.period ? MONTHS[S.period - 1] : 'Весь рік') + '</div>';
    h += '<div><span class="v num">' + (d ? tys(d.total) : '…') + '</span> <span class="muted">тис. грн</span></div></div>';
    if (d) h += controlHtml(d);
    h += '</section>';

    if (!d) { app.innerHTML = h + '<div class="loading">Завантаження…</div>'; bindChips(); return; }
    if (!d.rows) { app.innerHTML = h + '<div class="card muted">За ' + esc(periodName(S.period).toLowerCase()) + ' продажів немає.</div>'; bindChips(); return; }

    h += '<div class="two">';
    var dy = S.cache[0] || d, dm = S.period ? d : null;
    h += '<section class="card">' + groupsHtml(dm, dy) + '</section>';
    h += '<section class="card" id="clients">' + clientsHtml(d) + '</section>';
    h += '</div>';
    app.innerHTML = h;
    bindChips(); bindGroups(); bindClients(); drawCharts(dm, dy);
  }

  function bindChips() {
    var chips = document.getElementById('chips');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { var p = +b.getAttribute('data-p'); if (p !== S.period) selectPeriod(p); };
    });
    var sel = chips.querySelector('[aria-pressed="true"]');
    if (sel) chips.scrollLeft = Math.max(0, sel.offsetLeft - chips.clientWidth / 2 + sel.clientWidth / 2);
  }

  // 9.5 Контроль
  function controlHtml(d) {
    var tol = 1; // грн
    var bad = [];
    if (Math.abs(d.groupsSum - d.total) > tol) bad.push('сума груп ' + tys(d.groupsSum));
    if (Math.abs(d.clientsSum - d.total) > tol) bad.push('сума клієнтів ' + tys(d.clientsSum));
    if (d.control !== null && d.control !== undefined && Math.abs(d.control - d.total) > tol) bad.push('"Итог" 1С ' + tys(d.control));
    if (bad.length) return '<div class="status bad" role="alert"><span aria-hidden="true">⚠</span><div><b>Розбіжність контролю:</b> період ' +
      tys(d.total) + ', ' + bad.join(', ') + ' тис. грн</div></div>';
    if (d.control === null || d.control === undefined) return '<div class="status warn"><span aria-hidden="true">ⓘ</span><div>Групи й клієнти сходяться; контрольної суми 1С за цей період немає.</div></div>';
    return '<div class="status good"><span aria-hidden="true">✓</span><div>Контроль: групи = клієнти = "Итог" 1С</div></div>';
  }

  // 9.2 Групи: дві кругові діаграми — обраний місяць і рік
  function colorFor(name) {
    var i = S.init.groupOrder.indexOf(name);
    return i >= 0 && i < 8 ? cssVar('--s' + (i + 1)) : cssVar('--other');
  }
  function amountMap(d) { var m = {}; (d && d.groups || []).forEach(function (g) { m[g.name] = g.amount; }); return m; }
  // Окремі сектори: групи з часткою ≥ 5% у місяці АБО в році (з перших 8 за роком — кольори сталі)
  function mainGroups(dm, dy) {
    var th = S.init.otherThreshold, mm = amountMap(dm), my = amountMap(dy);
    return S.init.groupOrder.slice(0, 8).filter(function (n) {
      return (dm && dm.total && (mm[n] || 0) / dm.total >= th) || (dy && dy.total && (my[n] || 0) / dy.total >= th);
    });
  }
  function slices(d, main) {
    var m = amountMap(d), out = [], other = d.total;
    main.forEach(function (n) { var a = m[n] || 0; if (a > 0) { out.push({ name: n, amount: a, color: colorFor(n) }); other -= a; } });
    if (other > 0.5) out.push({ name: 'Інше', amount: other, color: cssVar('--other') });
    return out;
  }
  function groupsHtml(dm, dy) {
    var main = mainGroups(dm, dy), mm = amountMap(dm), my = amountMap(dy), both = !!dm;
    var h = '<h2>Продажі за продуктовими групами</h2>';
    h += '<div class="pies' + (both ? '' : ' one') + '">';
    if (both) h += pieBox('pieM', MONTHS[S.period - 1], dm.total);
    h += pieBox('pieY', 'Рік ' + S.init.year, dy.total);
    h += '</div>';
    h += '<table class="gt"><thead><tr><th>Група</th>' + (both ? '<th class="r">' + esc(MONTHS[S.period - 1]) + '</th>' : '') + '<th class="r">Рік</th></tr></thead><tbody>';
    function cell(a, t) { return '<td class="r"><span class="num">' + tys(a) + '</span><div class="pc num">' + pct(a, t) + '</div></td>'; }
    main.forEach(function (n) {
      h += '<tr><td><span class="sw" style="background:' + colorFor(n) + '"></span>' + esc(n) + '</td>' +
        (both ? cell(mm[n] || 0, dm.total) : '') + cell(my[n] || 0, dy.total) + '</tr>';
    });
    var rest = dy.groups.filter(function (g) { return main.indexOf(g.name) < 0; });
    if (both) dm.groups.forEach(function (g) { if (main.indexOf(g.name) < 0 && !my[g.name]) rest.push({ name: g.name, amount: 0 }); });
    if (rest.length) {
      var oy = dy.total - main.reduce(function (s, n) { return s + (my[n] || 0); }, 0);
      var om = both ? dm.total - main.reduce(function (s, n) { return s + (mm[n] || 0); }, 0) : 0;
      h += '<tr class="click" id="otherRow"><td><span class="sw" style="background:' + cssVar('--other') + '"></span>Інше <span class="muted">(' + rest.length + ')</span><span class="caret">' + (S.otherOpen ? '▲' : '▼') + '</span></td>' +
        (both ? cell(om, dm.total) : '') + cell(oy, dy.total) + '</tr>';
      if (S.otherOpen) {
        if (both) rest.sort(function (a, b) { return (mm[b.name] || 0) - (mm[a.name] || 0) || (my[b.name] || 0) - (my[a.name] || 0); });
        rest.forEach(function (g) {
          h += '<tr class="sub"><td>' + esc(g.name) + '</td>' + (both ? cell(mm[g.name] || 0, dm.total) : '') + cell(my[g.name] || 0, dy.total) + '</tr>';
        });
      }
    }
    h += '</tbody></table><div class="muted" style="font-size:12px;margin-top:8px">тис. грн без ПДВ і частка від продажів періоду</div>';
    return h;
  }
  function pieBox(id, title, total) {
    return '<div class="piebox"><div class="pt">' + esc(title) + '</div><div class="chartbox"><canvas id="' + id + '" role="img" aria-label="Кругова діаграма: ' + esc(title) + '"></canvas>' +
      '<div class="center"><div class="v num">' + tys(total) + '</div><div class="l">тис. грн</div></div></div></div>';
  }
  function bindGroups() {
    var r = document.getElementById('otherRow');
    if (r) r.onclick = function () { S.otherOpen = !S.otherOpen; render(); };
  }
  function drawCharts(dm, dy) {
    S.charts.forEach(function (c) { c.destroy(); }); S.charts = [];
    if (!window.Chart) return;
    var main = mainGroups(dm, dy);
    if (dm) S.charts.push(drawPie('pieM', dm, main));
    S.charts.push(drawPie('pieY', dy, main));
  }
  function drawPie(id, d, main) {
    var sl = slices(d, main);
    var pctLabels = {
      id: 'pctLabels',
      afterDatasetsDraw: function (chart) {
        var ctx = chart.ctx, meta = chart.getDatasetMeta(0);
        ctx.save(); ctx.font = '600 11px system-ui, sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        meta.data.forEach(function (arc, i) {
          var share = sl[i].amount / d.total; if (share < 0.08) return;
          var p = arc.tooltipPosition(); ctx.fillText(Math.round(share * 100) + '%', p.x, p.y);
        });
        ctx.restore();
      }
    };
    return new Chart(document.getElementById(id), {
      type: 'doughnut',
      data: { labels: sl.map(function (s) { return s.name; }), datasets: [{ data: sl.map(function (s) { return s.amount; }), backgroundColor: sl.map(function (s) { return s.color; }), borderColor: cssVar('--surface'), borderWidth: 2, hoverOffset: 4 }] },
      options: {
        cutout: '55%', responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: function (c) { return ' ' + c.label + ': ' + tys(c.raw) + ' тис. грн (' + pct(c.raw, d.total) + ')'; } } } },
        onClick: function (evt, els) {
          if (els.length && sl[els[0].index].name === 'Інше') { S.otherOpen = true; render(); var r = document.getElementById('otherRow'); if (r) r.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        }
      },
      plugins: [pctLabels]
    });
  }

  // 9.4 Клієнти: розгортання з топ-5 продуктами
  function itemsKey(k) { return S.period + '|' + k; }
  function clientsHtml(d) {
    var q = S.q.trim().toLowerCase();
    var list = q ? d.clients.filter(function (c) { return c.name.toLowerCase().indexOf(q) >= 0; }) : d.clients;
    var limit = S.showAll || q ? list.length : Math.min(20, list.length);
    var max = d.clients.length ? d.clients[0].amount : 1;
    var h = '<h2>Клієнти <span class="muted" style="font-weight:400">· ' + d.clients.length + '</span></h2>';
    h += '<input class="search" id="q" type="search" placeholder="Пошук клієнта" value="' + esc(S.q) + '" autocomplete="off">';
    h += '<div id="clist">';
    for (var i = 0; i < limit; i++) {
      var c = list[i], open = !!S.open[c.key];
      h += '<div class="cl' + (open ? ' open' : '') + '"><button class="client" data-k="' + esc(c.key) + '" aria-expanded="' + open + '"><div class="row1"><span class="name"><span class="caret">' + (open ? '▾' : '▸') + '</span> ' + esc(c.name) + '</span>' +
        '<span class="meta"><span class="num" style="color:var(--text);font-size:15px">' + tys(c.amount) + '</span><br><span class="num">' + pct(c.amount, d.total) + '</span></span></div>' +
        '<div class="bar"><i style="width:' + Math.max(1, c.amount / max * 100).toFixed(1) + '%"></i></div></button>';
      if (open) h += itemsHtml(c);
      h += '</div>';
    }
    if (!list.length) h += '<div class="muted" style="padding:10px 0">Нічого не знайдено</div>';
    h += '</div>';
    if (!q && !S.showAll && list.length > 20) h += '<button class="btn full" id="all">Показати всіх (' + list.length + ')</button>';
    h += '<div class="muted" style="font-size:12px;margin-top:8px">Натисніть на клієнта — його топ-5 продуктів. Суми в тис. грн без ПДВ.</div>';
    return h;
  }
  function itemsHtml(c) {
    var items = S.items[itemsKey(c.key)];
    if (!items) return '<div class="items muted">Завантаження…</div>';
    var full = !!S.full[c.key], show = full ? items : items.slice(0, 5);
    var h = '<div class="items"><table><thead><tr><th>' + (full ? 'Усі продукти' : 'Топ-5 продуктів') + '</th><th class="r">тис. грн</th><th class="r">Частка</th></tr></thead><tbody>';
    show.forEach(function (it, i) {
      h += '<tr><td><span class="rk">' + (i + 1) + '.</span> ' + esc(it.item) + '<div class="item-q num">' + fmtQ.format(it.qty) + ' ' + esc(it.unit) + '</div></td>' +
        '<td class="r num">' + tys(it.amount) + '</td><td class="r num">' + pct(it.amount, c.amount) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (items.length > 5) h += '<button class="lnk" data-full="' + esc(c.key) + '">' + (full ? 'Лише топ-5' : 'Показати всі продукти (' + items.length + ')') + '</button>';
    return h + '</div>';
  }
  function rerenderClients() {
    var box = document.getElementById('clients'); if (!box) return;
    box.innerHTML = clientsHtml(S.data); bindClients();
  }
  function bindClients() {
    var box = document.getElementById('clients');
    var q = document.getElementById('q');
    if (q) q.oninput = function () {
      S.q = q.value;
      var pos = q.selectionStart;
      rerenderClients();
      var nq = document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos, pos);
    };
    var all = document.getElementById('all');
    if (all) all.onclick = function () { S.showAll = true; rerenderClients(); };
    Array.prototype.forEach.call(box.querySelectorAll('[data-full]'), function (b) {
      b.onclick = function () { var k = b.getAttribute('data-full'); S.full[k] = !S.full[k]; rerenderClients(); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('.client'), function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-k');
        S.open[k] = !S.open[k];
        rerenderClients();
        var ik = itemsKey(k), per = S.period;
        if (S.open[k] && !S.items[ik]) {
          call('apiClientItems', S.init.year, per, k).then(function (items) {
            S.items[ik] = items;
            if (S.period === per) rerenderClients();
          }).catch(showError);
        }
      };
    });
  }

  /* ===================== Вкладки ===================== */
  function renderTabs() {
    var el = document.getElementById('tabs');
    var hasPF = S.init && S.init.planfactMonths && S.init.planfactMonths.length;
    if (!hasPF) { el.innerHTML = ''; return; }
    el.innerHTML = '<button class="tab" data-t="sales" aria-pressed="' + (S.tab !== 'pf') + '">Продажі</button>' +
      '<button class="tab" data-t="pf" aria-pressed="' + (S.tab === 'pf') + '">Собівартість</button>';
    Array.prototype.forEach.call(el.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { var t = b.getAttribute('data-t'); if (t === S.tab) return; S.tab = t; lsSet('tribo_tab', t); renderUpdated(); render(); window.scrollTo(0, 0); };
    });
  }

  /* ===================== Маржа (звіт план-факт, лише факт) ===================== */
  var PF = { month: null, cache: {}, gopen: {}, copen: {}, cgopen: {}, q: '', showAll: false, chart: null, otherOpen: false };
  function monthLabel(ym) { return MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
  function rent(o) { return o.c ? o.pr / o.c * 100 : null; }
  function rentTxt(o) { var r = rent(o); return r === null ? '—' : fmt1.format(r) + ' %'; }
  function qtyTxt(it) { return it.q ? fmtQ.format(it.q) + (it.u ? ' ' + it.u : '') : '—'; }
  function dt(s) { var d = new Date(s); return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function pfColor(d, name) { var i = d.groupOrder.indexOf(name); return i >= 0 && i < 8 ? cssVar('--s' + (i + 1)) : cssVar('--other'); }

  function renderPF() {
    var months = S.init.planfactMonths;
    if (!PF.month || months.indexOf(PF.month) < 0) PF.month = months[0];
    var d = PF.cache[PF.month];
    var h = '<section class="card hero grad">';
    h += '<div class="chips" id="pfchips" role="group" aria-label="Місяць">';
    months.slice().reverse().forEach(function (m) { h += '<button class="chip" data-m="' + m + '" aria-pressed="' + (m === PF.month) + '">' + esc(monthLabel(m)) + '</button>'; });
    h += '</div>';
    if (!d) {
      app.innerHTML = h + '<div class="loading">Завантаження…</div></section>'; bindPFChips();
      call('apiPlanFact', PF.month).then(function (x) { PF.cache[x.month] = x; if (S.tab === 'pf') render(); }).catch(showError);
      return;
    }
    var t = d.totals;
    h += '<div class="label">Сума продажів, без ПДВ</div><div class="big num">' + tys(t.f) + '</div><div class="unit">тис. грн</div>';
    h += '<div class="kpis2"><div><div class="l">Маржинальний прибуток</div><div class="v num">' + tys(t.pr) + ' <small>тис. грн</small></div></div>' +
      '<div><div class="l">Рентабельність</div><div class="v num">' + rentTxt(t) + '</div></div></div>';
    h += '<div class="meta">' + (d.loaded ? 'Звіт сформовано ' + esc(dt(d.loaded)) : '') +
      (d.control !== null && d.control !== undefined ? (Math.abs(d.control - t.f) > 2 ? ' · <span class="neg">⚠ не сходиться з «Общий итог» 1С (' + tys(d.control) + ')</span>' : ' · ✓ сходиться з 1С') : '') + '</div>';
    h += '</section>';
    h += '<div class="two"><section class="card" id="pfgroups">' + pfGroupsHtml(d) + '</section>';
    h += '<section class="card" id="pfclients">' + pfClientsHtml(d) + '</section></div>';
    app.innerHTML = h;
    bindPFChips(); bindPF(d); drawPFPie(d);
  }
  function bindPFChips() {
    var chips = document.getElementById('pfchips');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { var m = b.getAttribute('data-m'); if (m !== PF.month) { PF.month = m; PF.gopen = {}; PF.copen = {}; PF.cgopen = {}; render(); } };
    });
    var sel = chips.querySelector('[aria-pressed="true"]');
    if (sel) chips.scrollLeft = Math.max(0, sel.offsetLeft - chips.clientWidth / 2 + sel.clientWidth / 2);
  }
  function money(x) { return x === null ? '—' : new Intl.NumberFormat('uk-UA', { minimumFractionDigits: x < 100 ? 2 : 0, maximumFractionDigits: x < 100 ? 2 : 0 }).format(x); }
  function itemRows(items) {
    var h = '<div class="its">';
    items.forEach(function (it, i) {
      var per = it.u || 'од.';
      var price = it.q ? it.f / it.q : null, unitCost = it.q ? it.c / it.q : null;
      h += '<div class="it"><span class="rk">' + (i + 1) + '</span><div class="nm">' +
        '<div class="r1"><span>' + esc(it.n) + '</span><b class="num">' + tys(it.f) + '</b></div>' +
        '<div class="sub num">' + esc(qtyTxt(it)) + ' · ціна й собівартість у грн</div>' +
        '<div class="mx num">' +
          '<span><i>Ціна/' + esc(per) + '</i>' + money(price) + '</span>' +
          '<span><i>Собів./' + esc(per) + '</i>' + money(unitCost) + '</span>' +
          '<span><i>Маржа, тис</i><em class="' + (it.pr < 0 ? 'neg' : '') + '">' + tys(it.pr) + '</em></span>' +
          '<span><i>Рентаб.</i><em class="' + (it.pr < 0 ? 'neg' : '') + '">' + rentTxt(it) + '</em></span>' +
        '</div></div></div>';
    });
    return h + '</div>';
  }
  // 1) Кругова діаграма груп + рейтинг груп із продуктами
  function pfGroupsHtml(d) {
    var t = d.totals.f;
    var h = '<h2>Групи продуктів</h2><div class="pfpie"><canvas id="pfPie" role="img" aria-label="Кругова діаграма продажів за групами"></canvas>' +
      '<div class="center"><div class="v num">' + tys(t) + '</div><div class="l">тис. грн</div></div></div>';
    h += '<div class="legend">' + pfSlices(d).map(function (x) {
      return '<button class="lg" data-lg="' + esc(x.n) + '"><i style="background:' + x.color + '"></i>' + esc(x.n.replace(/^\([\d.]+\)\s*-?\s*/, '')) + ' <b class="num">' + pct(x.f, t) + '</b></button>';
    }).join('') + '</div>';
    h += '<div class="thead"><span>Група</span><span>тис. грн · рентаб.</span></div>';
    d.groups.forEach(function (g, i) {
      var open = !!PF.gopen[g.n];
      h += '<div class="cl' + (open ? ' open' : '') + '"><button class="row" data-g="' + esc(g.n) + '">' +
        '<span class="sw" style="background:' + pfColor(d, g.n) + '"></span><span class="nm">' + esc(g.n) + '<span class="sub">' + pct(g.f, t) + ' · ' + g.it.length + ' прод.</span></span>' +
        '<span class="vals num"><b>' + tys(g.f) + '</b><span class="' + (g.pr < 0 ? 'neg' : '') + '">' + rentTxt(g) + '</span></span><span class="caret">' + (open ? '▾' : '▸') + '</span></button>';
      if (open) h += itemRows(g.it);
      h += '</div>';
    });
    return h + '<div class="muted small">Рентабельність = маржинальний прибуток / собівартість</div>';
  }
  function pfSlices(d) {
    var t = d.totals.f, main = d.groups.filter(function (g, i) { return i < 8 && g.f / t >= 0.03; });
    var other = t - main.reduce(function (s, g) { return s + g.f; }, 0);
    var sl = main.map(function (g) { return { n: g.n, f: g.f, color: pfColor(d, g.n) }; });
    if (other > 0.5) sl.push({ n: 'Інше', f: other, color: cssVar('--other') });
    return sl;
  }
  function shortName(n) { n = n.replace(/^\([\d.]+\)\s*-?\s*/, ''); return n.length > 18 ? n.slice(0, 17) + '…' : n; }
  function drawPFPie(d) {
    if (PF.chart) { PF.chart.destroy(); PF.chart = null; }
    if (!window.Chart) return;
    var t = d.totals.f, sl = pfSlices(d), ink = cssVar('--text-2'), line = cssVar('--muted');
    var wide = document.getElementById('pfPie').parentNode.clientWidth >= 400; // на телефоні — лише %, назви в легенді
    PF.chart = new Chart(document.getElementById('pfPie'), {
      type: 'doughnut',
      data: { labels: sl.map(function (x) { return x.n; }), datasets: [{ data: sl.map(function (x) { return x.f; }), backgroundColor: sl.map(function (x) { return x.color; }), borderColor: cssVar('--surface'), borderWidth: 3, borderRadius: 4, hoverOffset: 6 }] },
      options: { cutout: '58%', responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
        layout: { padding: wide ? { left: 96, right: 96, top: 22, bottom: 22 } : { left: 34, right: 34, top: 24, bottom: 24 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return ' ' + c.label + ': ' + tys(c.raw) + ' тис. грн (' + pct(c.raw, t) + ')'; } } } },
        onClick: function (e, els) {
          if (!els.length) return;
          var n = sl[els[0].index].n; if (n === 'Інше') return;
          PF.gopen[n] = true; document.getElementById('pfgroups').innerHTML = pfGroupsHtml(d); drawPFPie(d);
          var el = document.querySelector('#pfgroups [data-g="' + CSS.escape(n) + '"]'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } },
      plugins: [{ id: 'pfLabels', afterDatasetsDraw: function (ch) {
        var ctx = ch.ctx, meta = ch.getDatasetMeta(0), lastY = { l: -99, r: -99 };
        ctx.save();
        meta.data.forEach(function (a, i) {
          var s = sl[i].f / t; if (s < 0.025) return;
          var mid = (a.startAngle + a.endAngle) / 2, cos = Math.cos(mid), sin = Math.sin(mid);
          var x1 = a.x + cos * a.outerRadius, y1 = a.y + sin * a.outerRadius;
          var right = cos >= 0, side = right ? 'r' : 'l';
          var y2 = a.y + sin * (a.outerRadius + 14);
          var gap = wide ? 26 : 15; if (Math.abs(y2 - lastY[side]) < gap) y2 = lastY[side] + (sin >= 0 ? gap : -gap);
          lastY[side] = y2;
          var x2 = a.x + cos * (a.outerRadius + 10), x3 = right ? x2 + 8 : x2 - 8;
          ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y2); ctx.stroke();
          ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
          ctx.fillStyle = ink; ctx.font = '600 11px system-ui, sans-serif';
          ctx.fillText(Math.round(s * 100) + '%', right ? x3 + 3 : x3 - 3, wide ? y2 - 7 : y2);
          if (wide) { ctx.font = '11px system-ui, sans-serif'; ctx.fillText(shortName(sl[i].n), right ? x3 + 3 : x3 - 3, y2 + 7); }
        });
        ctx.restore(); } }]
    });
  }
  // 2) Клієнти: стовпчикова діаграма-рейтинг, розгортання → групи → продукти
  function pfClientsHtml(d) {
    var q = PF.q.trim().toLowerCase();
    var list = q ? d.clients.filter(function (c) { return c.n.toLowerCase().indexOf(q) >= 0; }) : d.clients;
    var limit = PF.showAll || q ? list.length : Math.min(15, list.length);
    var max = d.clients.length ? d.clients[0].f : 1, t = d.totals.f;
    var h = '<h2>Клієнти <span class="muted" style="font-weight:400">· ' + d.clients.length + '</span></h2>';
    h += '<input class="search" id="pfq" type="search" placeholder="Пошук клієнта" value="' + esc(PF.q) + '" autocomplete="off">';
    for (var i = 0; i < limit; i++) {
      var c = list[i], open = !!PF.copen[c.key];
      h += '<div class="cl' + (open ? ' open' : '') + '"><button class="row bar-row" data-c="' + esc(c.key) + '">' +
        '<span class="rk">' + (d.clients.indexOf(c) + 1) + '</span><span class="nm">' + esc(c.n) +
        (c.rg && c.rg !== 'Украина' ? ' <span class="badge">' + esc(c.rg) + '</span>' : '') +
        '<span class="gbar"><i style="width:' + Math.max(1.5, c.f / max * 100).toFixed(1) + '%"></i></span>' +
        '<span class="sub">' + pct(c.f, t) + ' · рентаб. ' + rentTxt(c) + '</span></span>' +
        '<span class="vals num"><b>' + tys(c.f) + '</b><span class="mg' + (c.pr < 0 ? ' neg' : '') + '">маржа ' + tys(c.pr) + '</span></span><span class="caret">' + (open ? '▾' : '▸') + '</span></button>';
      if (open) {
        c.g.forEach(function (g) {
          var gk = c.key + '|' + g.n, go = PF.cgopen[gk] !== false; // групи клієнта розгорнуті за замовчуванням
          h += '<div class="cg"><button class="row cg-row" data-cg="' + esc(gk) + '"><span class="sw" style="background:' + pfColor(d, g.n) + '"></span>' +
            '<span class="nm">' + esc(g.n) + '</span><span class="vals num"><b>' + tys(g.f) + '</b><span class="' + (g.pr < 0 ? 'neg' : '') + '">' + rentTxt(g) + '</span></span><span class="caret">' + (go ? '▾' : '▸') + '</span></button>';
          if (go) h += itemRows(g.it);
          h += '</div>';
        });
      }
      h += '</div>';
    }
    if (!list.length) h += '<div class="muted" style="padding:10px 0">Нічого не знайдено</div>';
    if (!q && !PF.showAll && list.length > 15) h += '<button class="btn full" id="pfall">Показати всіх (' + list.length + ')</button>';
    return h + '<div class="muted small">Суми — тис. грн без ПДВ, від більшого до меншого</div>';
  }
  function bindPF(d) {
    var gbox = document.getElementById('pfgroups');
    gbox.onclick = function (e) {
      var lg = e.target.closest('[data-lg]');
      if (lg) { // клік у легенді: відкрити групу і прокрутити до неї («Інше» — до списку)
        var ln = lg.getAttribute('data-lg');
        if (ln !== 'Інше') PF.gopen[ln] = true;
        gbox.innerHTML = pfGroupsHtml(d); drawPFPie(d);
        var target = ln === 'Інше' ? gbox.querySelector('.thead') : gbox.querySelector('[data-g="' + CSS.escape(ln) + '"]');
        if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' });
        return;
      }
      var b = e.target.closest('[data-g]'); if (!b) return;
      var n = b.getAttribute('data-g'); PF.gopen[n] = !PF.gopen[n];
      gbox.innerHTML = pfGroupsHtml(d); drawPFPie(d);
    };
    var box = document.getElementById('pfclients');
    var rer = function () { box.innerHTML = pfClientsHtml(d); bindQ(); };
    function bindQ() {
      var q = document.getElementById('pfq');
      q.oninput = function () { PF.q = q.value; var pos = q.selectionStart; rer(); var n = document.getElementById('pfq'); n.focus(); n.setSelectionRange(pos, pos); };
      var all = document.getElementById('pfall'); if (all) all.onclick = function () { PF.showAll = true; rer(); };
    }
    box.onclick = function (e) {
      var cg = e.target.closest('[data-cg]');
      if (cg) { var gk = cg.getAttribute('data-cg'); PF.cgopen[gk] = PF.cgopen[gk] === false; rer(); return; }
      var b = e.target.closest('[data-c]'); if (!b) return;
      var k = b.getAttribute('data-c'); PF.copen[k] = !PF.copen[k]; rer();
    };
    bindQ();
  }
})();
</script>
</body>
